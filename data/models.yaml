  tasks: [qa, molecule understanding]
  note: Aligns molecule-graph and protein encoders into a 7B backbone so both can be queried in free text.

- name: PRESTO
  title: "PRESTO: Progressive Pretraining Enhances Synthetic Chemistry Outcomes"
  year: 2024
  venue: "Findings of EMNLP 2024"
