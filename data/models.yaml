- name: ReactXT
  title: "ReactXT: Understanding Molecular \"Reaction-ship\" via Reaction-Contextualized Molecule-Text Pretraining"
  year: 2024
  venue: "Findings of ACL 2024"
  paper: https://arxiv.org/abs/2405.14225
  code: https://github.com/syr-cn/ReactXT
  license: MIT
  category: reaction
  modalities: [reaction, graph, text, smiles]
  tasks: [procedure prediction, retrosynthesis, captioning]
