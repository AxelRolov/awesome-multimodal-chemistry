- name: 3M-Diffusion
  title: "3M-Diffusion: Latent Multi-Modal Diffusion for Language-Guided Molecular Structure Generation"
  year: 2024
  venue: "COLM 2024"
  paper: https://arxiv.org/abs/2403.07179
  code: https://github.com/huaishengzhu/3MDiffusion
  license: unspecified
  category: molecule-text
  modalities: [text, graph]
  tasks: [text-guided generation]
  note: Aligns a graph latent space to text, then diffuses in it — the first strong text→graph diffusion result.

- name: LDMol
  title: "LDMol: A Text-to-Molecule Diffusion Model with Structurally Informative Latent Space Surpasses AR Models"
  year: 2024
  venue: "ICML 2025"
  paper: https://arxiv.org/abs/2405.17829
  code: https://github.com/jinhojsk515/ldmol
  license: Apache-2.0
  category: molecule-text
  modalities: [text, smiles]
  tasks: [text-to-molecule, editing]
  note: Direct evidence that latent diffusion beats autoregressive decoding when the latent space is chemistry-aware.

- name: UTGDiff
  title: "Instruction-Based Molecular Graph Generation with Unified Text-Graph Diffusion Model"
  year: 2024
  venue: "arXiv"
  paper: https://arxiv.org/abs/2408.09896
  code: https://github.com/ran1812/UTGDiff
  license: unspecified
  category: molecule-text
  modalities: [text, graph]
  tasks: [instruction-based generation, editing]
  note: One denoising network over a joint text–graph token space rather than two aligned encoders.

- name: UniMoT
  title: "UniMoT: Unified Molecule-Text Language Model with Discrete Token Representation"
  year: 2024
  venue: "IJCAI 2025"
  paper: https://arxiv.org/abs/2408.00863
  code: null
  license: unspecified
  category: mllm
  modalities: [graph, text, smiles]
  tasks: [captioning, text-to-molecule]
  note: VQ-tokenises molecules into the LLM's own vocabulary; elegant unification, sparse public code.

- name: ChemVLM
  title: "ChemVLM: Exploring the Power of Multimodal Large Language Models in Chemistry Area"
  year: 2024
  venue: "AAAI 2025"
  paper: https://arxiv.org/abs/2408.07246
  code: https://github.com/lijunxian111/ChemVlm
