# Models and systems — single source of truth for README tables and the docs site.
#
# Fields
#   name       short model name
#   title      official paper title
#   year       year of first public release (preprint or publication, whichever came first)
#   venue      publication venue
#   paper      canonical paper URL (arXiv abs preferred, else DOI)
#   code       official repository, or null
#   license    code license as stated by the authors, or "unspecified"
#   category   one of: molecule-text | multi-view | mllm | image | reaction | spectra | materials
#   modalities free tags drawn from: text, smiles, graph, 3d, image, ir, nmr, ms, reaction, kg, crystal
#   tasks      free tags
#   note       one line on what makes it worth reading

- name: Text2Mol
  title: "Text2Mol: Cross-Modal Molecule Retrieval with Natural Language Queries"
  year: 2021
  venue: "EMNLP 2021"
  paper: https://aclanthology.org/2021.emnlp-main.47/
  code: https://github.com/cnedwards/text2mol
  license: unspecified
  category: molecule-text
  modalities: [text, smiles, graph]
  tasks: [retrieval]
  note: The paper that made molecule–language retrieval a task, and the origin of the ChEBI-20 benchmark.

- name: KV-PLM
  title: "A deep-learning system bridging molecule structure and biomedical text with comprehension comparable to human professionals"
  year: 2022
  venue: "Nature Communications"
  paper: https://doi.org/10.1038/s41467-022-28494-3
  code: https://github.com/thunlp/KV-PLM
  license: unspecified
  category: molecule-text
  modalities: [text, smiles]
  tasks: [retrieval, qa, property prediction]
  note: Earliest unified SMILES + biomedical-text language model; sequence-only, no explicit structure.

- name: MolT5
  title: "Translation between Molecules and Natural Language"
  year: 2022
  venue: "EMNLP 2022"
  paper: https://arxiv.org/abs/2204.11817
  code: https://github.com/blender-nlp/MolT5
  license: BSD-3-Clause
  category: molecule-text
  modalities: [text, smiles]
  tasks: [captioning, text-to-molecule]
  note: Established molecule ↔ language translation as a benchmark family; still the default seq2seq baseline.

- name: MoMu
  title: "A Molecular Multimodal Foundation Model Associating Molecule Graphs with Natural Language"
  year: 2022
  venue: "arXiv"
  paper: https://arxiv.org/abs/2209.05481
  code: https://github.com/BingSu12/MoMu
  license: "non-commercial academic use"
  category: molecule-text
  modalities: [text, graph]
  tasks: [retrieval, captioning, text-to-graph, property prediction]
  note: First contrastive graph–text foundation model; supervision harvested from paper text, so pairs are weak.

- name: GraphMVP
  title: "Pre-training Molecular Graph Representation with 3D Geometry"
  year: 2021
  venue: "ICLR 2022"
  paper: https://arxiv.org/abs/2110.07728
  code: https://github.com/chao1224/GraphMVP
  license: MIT
  category: multi-view
  modalities: [graph, 3d]
  tasks: [property prediction]
  note: The canonical 2D↔3D multi-view pretraining recipe; 3D as a teacher for a 2D encoder.

- name: Uni-Mol
  title: "Uni-Mol: A Universal 3D Molecular Representation Learning Framework"
  year: 2023
  venue: "ICLR 2023"
  paper: https://openreview.net/forum?id=6K2RM6wVqKu
  code: https://github.com/deepmodeling/Uni-Mol
  license: MIT
  category: multi-view
  modalities: [3d, graph]
  tasks: [property prediction, docking, binding pose]
  note: 209M conformations + 3M pockets; the 3D backbone that later multimodal assistants plug in.

- name: MoleculeSTM
  title: "Multi-modal molecule structure–text model for text-based retrieval and editing"
  year: 2023
  venue: "Nature Machine Intelligence"
  paper: https://arxiv.org/abs/2212.10789
  code: https://github.com/chao1224/MoleculeSTM
  license: "NVIDIA Source Code License (non-commercial)"
  category: molecule-text
  modalities: [text, graph, smiles]
  tasks: [retrieval, text-guided editing, property prediction]
  note: Introduced open-vocabulary text-based molecule editing; dataset release constrained by text licensing.

- name: MolFM
  title: "MolFM: A Multimodal Molecular Foundation Model"
  year: 2023
  venue: "arXiv"
  paper: https://arxiv.org/abs/2307.09484
  code: https://github.com/PharMolix/OpenBioMed
  license: MIT
  category: molecule-text
  modalities: [graph, text, kg]
  tasks: [retrieval, captioning, text-to-molecule, property prediction]
  note: Adds a knowledge graph as a third modality; +12.13 pp zero-shot cross-modal retrieval.

- name: BioT5
  title: "BioT5: Enriching Cross-modal Integration in Biology with Chemical Knowledge and Natural Language Associations"
  year: 2023
  venue: "EMNLP 2023"
  paper: https://arxiv.org/abs/2310.07276
  code: https://github.com/QizhiPei/BioT5
  license: MIT
  category: molecule-text
  modalities: [text, smiles]
  tasks: [captioning, text-to-molecule, property prediction]
  note: SELFIES-based T5 that fixes MolT5's invalid-output problem.

- name: MolCA
  title: "MolCA: Molecular Graph-Language Modeling with Cross-Modal Projector and Uni-Modal Adapter"
  year: 2023
  venue: "EMNLP 2023"
  paper: https://arxiv.org/abs/2310.12798
  code: https://github.com/acharkq/MolCA
  license: unspecified
  category: molecule-text
  modalities: [graph, text, smiles]
  tasks: [captioning, retrieval, qa]
  note: The Q-Former-style projector that most later graph–LLM assistants reuse; ships PubChem324k.

- name: InstructMol
  title: "InstructMol: Multi-Modal Integration for Building a Versatile and Reliable Molecular Assistant in Drug Discovery"
  year: 2023
  venue: "COLING 2025"
  paper: https://arxiv.org/abs/2311.16208
  code: https://github.com/IDEA-XL/InstructMol
  license: "Apache-2.0 (code); CC BY-NC 4.0 (data)"
  category: mllm
  modalities: [graph, text, smiles]
  tasks: [qa, property prediction, reaction prediction]
  note: Two-stage alignment + instruction tuning on a frozen LLM; the practical assistant template.

- name: GIT-Mol
  title: "GIT-Mol: A Multi-modal Large Language Model for Molecular Science with Graph, Image, and Text"
  year: 2023
  venue: "Computers in Biology and Medicine"
  paper: https://arxiv.org/abs/2308.06911
  code: https://github.com/AI-HPC-Research-Team/GIT-Mol
  license: MIT
  category: mllm
  modalities: [graph, image, text, smiles]
  tasks: [property prediction, captioning, image-to-smiles]
  note: First graph+image+text chemistry model; GIT-Former with cross-modal matching and contrastive losses.

- name: BioT5+
  title: "BioT5+: Towards Generalized Biological Understanding with IUPAC Integration and Multi-task Tuning"
  year: 2024
  venue: "Findings of ACL 2024"
  paper: https://arxiv.org/abs/2402.17810
  code: https://github.com/QizhiPei/BioT5
  license: MIT
  category: molecule-text
  modalities: [text, smiles]
  tasks: [captioning, text-to-molecule, property prediction, classification]
  note: 15 task types over 21 datasets; first place in the ACL 2024 text-based molecule generation track.

- name: MolLM
  title: "MolLM: a unified language model for integrating biomedical text with 2D and 3D molecular representations"
  year: 2024
  venue: "Bioinformatics (ISMB 2024)"
  paper: https://doi.org/10.1093/bioinformatics/btae260
  code: https://github.com/gersteinlab/MolLM
  license: unspecified
  category: multi-view
  modalities: [text, graph, 3d]
  tasks: [retrieval, captioning, editing, property prediction]
