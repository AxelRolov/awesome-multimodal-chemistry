- name: MolScribe
  title: "MolScribe: Robust Molecular Structure Recognition with Image-to-Graph Generation"
  year: 2022
  venue: "J. Chem. Inf. Model."
  paper: https://arxiv.org/abs/2205.14311
  code: https://github.com/thomas0809/MolScribe
  license: MIT
  category: image
  modalities: [image, graph]
  tasks: [ocr, image-to-structure]
