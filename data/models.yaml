- name: MolNexTR
  title: "MolNexTR: A Generalized Deep Learning Model for Molecular Image Recognition"
  year: 2024
  venue: "Journal of Cheminformatics"
  paper: https://arxiv.org/abs/2403.03691
  code: https://github.com/CYF2000127/MolNexTR
