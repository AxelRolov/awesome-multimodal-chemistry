  category: reaction
  modalities: [graph, text, reaction]
  tasks: [reaction prediction, retrosynthesis, reagent prediction]
  note: Models interaction between multiple molecule graphs at once, which single-molecule projectors cannot represent for reactions.

- name: InstructBioMol
  title: "Advancing biomolecular understanding and design following human instructions"
  year: 2024
  venue: "Nature Machine Intelligence 2025"
